name: Upgrade Dependencies

on:
  schedule:
    # Weekly on Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  upgrade-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: renovatebot/github-action@v46.3.5
        with:
          token: ${{ secrets.KAD_WORKFLOW_AUTOMATION }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate[bot]@users.noreply.github.com>"
          RENOVATE_HOST_RULES: '[{"matchHost":"npm.pkg.github.com","hostType":"npm","token":"${{ github.token }}"}]'
          RENOVATE_NPMRC_MERGE: "true"
          RENOVATE_CI: true
          LOG_LEVEL: debug
          CI: "true"
